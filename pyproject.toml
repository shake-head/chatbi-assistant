[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbi-assistant"
version = "0.1.0"
description = "Backend service for the AI data analysis assistant (ChatBI)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "bcrypt>=4.2.0,<6.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=2.2.0,<4.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "pyarrow>=17.0.0,<25.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "redis>=5.1.0,<8.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "xlrd>=2.0.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/css/*", "static/js/*", "static/vendor/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
